<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNext SupportHub · Support Request</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#18213b;font:16px system-ui,Arial;min-height:100dvh;display:grid;place-items:center;padding:18px}.card{width:min(100%,490px);background:white;border:1px solid #e1e7f0;border-radius:20px;padding:28px;box-shadow:0 18px 55px #14203c12}.brand{font-size:21px;font-weight:800;margin-bottom:25px}.brand span{color:#ff6600}h1{font-size:25px;margin:0 0 8px}p{color:#68758b;line-height:1.5;margin:0 0 25px}label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}input,textarea{width:100%;padding:13px 14px;border:1px solid #d6dfeb;border-radius:10px;font:inherit;color:#18213b}input:focus,textarea:focus{outline:2px solid #ff660088;border-color:#ff6600}textarea{min-height:110px;resize:vertical}.captcha-wrap{margin-top:20px;min-height:70px;display:flex;align-items:center;justify-content:flex-start}button{margin-top:22px;background:#ff6600;color:white;border:0;border-radius:10px;width:100%;padding:14px;font-weight:750;font-size:16px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.msg{margin-top:18px;padding:12px;border-radius:9px;background:#fff1e8;color:#92400e;display:none}.msg.ok{background:#e9f9f2;color:#136b43}.hidden{position:absolute;left:-10000px}small{display:block;margin-top:16px;color:#69768b}</style><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script></head><body><main class="card"><div class="brand"><span>UNext</span> SupportHub</div><h1>Raise a support request</h1><p>Having trouble with a DID or calling operation? Submit your request to the support team. No login required.</p><form id="form"><label for="employee_name">Employee name</label><input id="employee_name" name="employee_name" type="text" minlength="2" maxlength="120" autocomplete="name" required placeholder="Name in employee directory"><label for="phone">Agent mobile number</label><input id="phone" name="agent_number" type="tel" inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" autocomplete="tel" required placeholder="10-digit registered Indian mobile number"><label for="email">Employee email address</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" required placeholder="Your registered work email"><label for="issue">Describe the issue</label><textarea id="issue" name="issue_summary" minlength="10" maxlength="500" required placeholder="What went wrong? Include any relevant details, but no passwords or PINs."></textarea><div class="hidden"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div><div class="captcha-wrap"><div class="cf-turnstile" data-sitekey="__TURNSTILE_SITE_KEY__" data-theme="light" data-callback="turnstileVerified" data-expired-callback="turnstileExpired" data-error-callback="turnstileExpired"></div></div><button id="send">Submit request</button><div class="msg" id="message" role="status" aria-live="polite"></div></form><small>Requests are matched against active DID assignments and reviewed before replacement. Submitting does not automatically reassign a DID.</small></main><script>let captchaToken='';window.turnstileVerified=(token)=>{captchaToken=token};window.turnstileExpired=()=>{captchaToken=''};document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,button=document.querySelector('#send'),msg=document.querySelector('#message');button.disabled=true;msg.style.display='none';try{if(!captchaToken)throw Error('Complete the security check before submitting');const data=Object.fromEntries(new FormData(form));data.turnstile_token=captchaToken;const phone=data.agent_number.trim(),email=data.email.trim().toLowerCase(),name=data.employee_name.trim();if(!/^[6-9][0-9]{9}$/.test(phone)||new Set(phone).size===1||['9876543210','9876543211','8765432109'].includes(phone))throw Error('Enter your real registered 10-digit mobile number');if(!/^[a-z][a-z .'-]{2,119}$/i.test(name))throw Error('Enter your full registered employee name');if(['example.com','example.org','test.com','mailinator.com','yopmail.com'].includes(email.split('@')[1])||['test','dummy','sample','example','abc'].includes(email.split('@')[0]))throw Error('Enter your registered official email, not a test address');const res=await fetch('/api/public/support-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const out=await res.json();if(!res.ok)throw Error(typeof out.detail==='string'?out.detail:'Request could not be saved');msg.textContent=out.message+' Reference: '+out.request_id+(out.repeated?' (repeat request recorded)':'');msg.className='msg ok';form.reset();captchaToken='';window.turnstile?.reset()}catch(err){msg.textContent=err.message;msg.className='msg'}finally{if(!msg.classList.contains('ok')){captchaToken='';window.turnstile?.reset()}msg.style.display='block';button.disabled=false}})</script></body></html>
