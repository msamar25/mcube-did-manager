name: MCube request queue maintenance
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger request import, reminders and employee refresh
        env:
          MCUBE_APP_URL: ${{ secrets.MCUBE_APP_URL }}
          MCUBE_MAINTENANCE_TOKEN: ${{ secrets.MCUBE_MAINTENANCE_TOKEN }}
        run: |
          test -n "$MCUBE_APP_URL" && test -n "$MCUBE_MAINTENANCE_TOKEN"
          curl --fail-with-body --show-error --silent --retry 2 --max-time 300 \
            -X POST "${MCUBE_APP_URL%/}/api/maintenance/tick" \
            -H "Authorization: Bearer $MCUBE_MAINTENANCE_TOKEN" \
            -H 'Content-Type: application/json'
